<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300&display=swap" rel="stylesheet">
<script src="../assets/js/script.js"></script>

</head>
<body>
  <nav class="navbar" id="myNavbar">
    <div class="container-fluid">
      <a href="#home">Logo</a>      
      <a href="#actualidad">Actualidad</a>
      <a href="#vigilancia">Vigilancia</a>
      <a href="#accidentes">Accidentes</a>
      <a href="#sobre-nosotros">Sobre Nosotros</a>
      <a href="pages\contacto.html">Contacto</a>
    
      <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">&#9776;</a>
    </div>
  </nav>
<section class="contacto">
  <div class="contacto-titulo">
    <h1>Comunicate con Nosotros</h1>
  </div>
  <div class="contacto-formulario d-flex flex-column justify-content-center align-items-center">
    
    <form action="paoladeembalse@gmail.com" method="POST">
      <h2>Completa tus Datos</h2><br><br>
      <label for="nombre">Nombre:</label>
      <input class= "input" type="text" id="nombre" name="nombre" required>
      <label for="apellido">Apellido:</label>
      <input class= "input" type="text" id="apellido" name="apellido" required><br><br>

      <label for="tel">Teléfono:</label>
      <input class="input" type="tel" id="tel" name="tel">

      <label for="email">Correo Electrónico:</label>
      <input class="input" type="email" id="email" name="email" required><br><br>

      <label for="comentario">Comentario:</label><br>
      <textarea class="input" id="comentario" name="comentario" rows="6" cols="70"></textarea><br><br>
      
      <input type="checkbox" id="informacion" name="informacion">
      <label for="informacion">Me gustaría recibir información</label>
      <br><br>
      <div class="text-right">
        <input class="input" type="submit" value="Enviar">
      </div>
    </form>
  </div>
  <div class="contacto-redes d-flex flex-column justify-content-center align-items-center">
    <h2>Necesitas comunicarte con Nosotros?</h2>
    <h3>En nuestras redes:</h3>
    <ul>
        <li>
            <span class="social-icons">&#9733;</span>
            <a href="https://www.instagram.com/">Instagram</a>
        </li>
        <li>
            <span class="social-icons">&#9829;</span>
            <a href="https://www.facebook.com/">Facebook</a>
        </li>
        <li>
            <span class="social-icons">&#9733;</span>
            <a href="https://twitter.com/">Twitter</a>
        </li>
    </ul>

  </div>

  

</section>  


</body>
</html>
